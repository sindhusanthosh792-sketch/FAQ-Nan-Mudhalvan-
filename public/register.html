<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | AI FAQ Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="navbar-brand-badge"><i class="fas fa-brain me-1"></i>AI FAQ</div>
        <span class="fw-bold fs-5 text-dark">Assistant</span>
      </a>
      <div class="ms-auto" id="nav-auth-links"></div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">

        <div class="card card-custom p-4 p-md-5 shadow-lg border-0 rounded-4">
          <div class="text-center mb-4">
            <div class="bg-primary-light text-primary d-inline-flex p-3 rounded-circle mb-3">
              <i class="fas fa-user-plus fa-2x"></i>
            </div>
            <h3 class="fw-bold">Create Account</h3>
            <p class="text-muted small">Register to ask queries & save favorite FAQs</p>
          </div>

          <div id="register-error" class="alert alert-danger d-none" role="alert"></div>

          <form id="register-form">
            <div class="mb-3">
              <label for="reg-name" class="form-label font-weight-semibold">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                <input type="text" class="form-control bg-light border-start-0" id="reg-name" placeholder="John Doe" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label font-weight-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0" id="reg-email" placeholder="john@example.com" required>
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6 mb-3 mb-md-0">
                <label for="reg-password" class="form-label font-weight-semibold">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                  <input type="password" class="form-control bg-light border-start-0" id="reg-password" placeholder="Min 6 chars" required>
                </div>
              </div>
              <div class="col-md-6">
                <label for="reg-confirm-password" class="form-label font-weight-semibold">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="fas fa-check-double text-muted"></i></span>
                  <input type="password" class="form-control bg-light border-start-0" id="reg-confirm-password" placeholder="Repeat password" required>
                </div>
              </div>
            </div>

            <div class="mb-4">
              <label for="reg-role" class="form-label font-weight-semibold">Account Role</label>
              <select id="reg-role" class="form-select bg-light">
                <option value="user" selected>Student / User</option>
                <option value="admin">Administrator (For Testing)</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">
              <i class="fas fa-user-check me-1"></i> Register Account
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-0 text-muted small">Already have an account? <a href="/login.html" class="text-primary fw-bold text-decoration-none">Log in here</a></p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
