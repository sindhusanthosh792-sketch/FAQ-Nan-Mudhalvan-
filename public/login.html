<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | AI FAQ Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-light navbar-custom">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <div class="navbar-brand-badge"><i class="fas fa-brain me-1"></i>AI FAQ</div>
        <span class="fw-bold fs-5 text-dark">Assistant</span>
      </a>
      <div class="ms-auto" id="nav-auth-links"></div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">

        <div class="card card-custom p-4 p-md-5 shadow-lg border-0 rounded-4">
          <div class="text-center mb-4">
            <div class="bg-primary-light text-primary d-inline-flex p-3 rounded-circle mb-3">
              <i class="fas fa-user-lock fa-2x"></i>
            </div>
            <h3 class="fw-bold">User Login</h3>
            <p class="text-muted small">Sign in to access your student or admin portal</p>
          </div>

          <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

          <form id="login-form">
            <div class="mb-3">
              <label for="login-email" class="form-label font-weight-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                <input type="email" class="form-control bg-light border-start-0" id="login-email" placeholder="e.g. admin@example.com" required>
              </div>
            </div>

            <div class="mb-4">
              <label for="login-password" class="form-label font-weight-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                <input type="password" class="form-control bg-light border-start-0" id="login-password" placeholder="••••••••" required>
              </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm">
              <i class="fas fa-sign-in-alt me-1"></i> Log In
            </button>
          </form>

          <div class="text-center mt-4 pt-3 border-top">
            <p class="mb-0 text-muted small">Don't have an account? <a href="/register.html" class="text-primary fw-bold text-decoration-none">Register here</a></p>
          </div>
        </div>

        <!-- Sample Credentials Box for Evaluators -->
        <div class="card mt-4 border-info bg-info-subtle p-3 rounded-3 small">
          <h6 class="fw-bold text-info-emphasis mb-2"><i class="fas fa-key me-1"></i> Demo Credentials (Naan Mudhalvan Evaluation)</h6>
          <div class="d-flex justify-content-between mb-1">
            <span><strong>Admin Account:</strong> <code>admin@example.com</code></span>
            <span>Password: <code>Admin@123</code></span>
          </div>
          <div class="d-flex justify-content-between">
            <span><strong>Student Account:</strong> <code>student@example.com</code></span>
            <span>Password: <code>Student@123</code></span>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
